name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: android-ui/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null 2>&1 \
            || yes | sdkmanager "platforms;android-36" "build-tools;35.0.1" "platform-tools" > /dev/null 2>&1
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > android-ui/android/local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-ui/android/**/*.gradle', 'android-ui/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Install npm dependencies
        working-directory: android-ui
        run: npm ci

      - name: Build web assets
        working-directory: android-ui
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: android-ui
        run: npx cap sync android

      - name: Fix missing colors.xml
        working-directory: android-ui/android
        run: |
          if [ ! -f app/src/main/res/values/colors.xml ]; then
            cat > app/src/main/res/values/colors.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#007AFF</color>
              <color name="colorPrimaryDark">#005EC4</color>
              <color name="colorAccent">#007AFF</color>
          </resources>
          EOF
            echo "Created colors.xml"
          else
            echo "colors.xml already exists"
          fi

      - name: Increase Gradle memory
        working-directory: android-ui/android
        run: |
          sed -i 's/org.gradle.jvmargs=-Xmx1536m/org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8/' gradle.properties

      - name: Fix cordova plugins SDK version
        working-directory: android-ui/android
        run: |
          sed -i "s/compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36/compileSdk = rootProject.ext.compileSdkVersion/" capacitor-cordova-android-plugins/build.gradle
          sed -i "s/targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36/targetSdkVersion rootProject.ext.targetSdkVersion/" capacitor-cordova-android-plugins/build.gradle

      - name: Pre-build verification
        working-directory: android-ui/android
        run: |
          echo "=== Java ==="
          java -version 2>&1
          echo "=== ANDROID_HOME ==="
          echo "$ANDROID_HOME"
          echo "=== local.properties ==="
          cat local.properties
          echo "=== variables.gradle ==="
          cat variables.gradle
          echo "=== Critical files ==="
          for f in \
            build.gradle \
            app/build.gradle \
            settings.gradle \
            capacitor.settings.gradle \
            gradle/wrapper/gradle-wrapper.properties \
            capacitor-cordova-android-plugins/build.gradle \
            capacitor-cordova-android-plugins/cordova.variables.gradle \
            app/src/main/res/values/colors.xml \
            app/src/main/res/values/styles.xml \
            app/src/main/AndroidManifest.xml \
            app/src/main/assets/public/index.html \
            app/src/main/res/xml/config.xml \
            app/capacitor.build.gradle; do
            if [ -f "$f" ]; then
              echo "  OK: $f"
            else
              echo "  MISSING: $f"
            fi
          done
          echo "=== Capacitor Android lib ==="
          ls -la ../node_modules/@capacitor/android/capacitor/build.gradle

      - name: Build debug APK
        working-directory: android-ui/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Verify APK
        working-directory: android-ui/android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found!"
            find app/build -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "APK: $(ls -lh $APK)"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android-ui/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: android-ui/android/app/build/outputs/apk/debug/app-debug.apk
