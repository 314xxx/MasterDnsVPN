name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: android-ui/package-lock.json

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: android-ui
        run: npm ci

      - name: Build Web assets
        working-directory: android-ui
        run: npm run build

      - name: Copy assets to Android project
        run: |
          mkdir -p android-app/app/src/main/assets
          cp -r android-ui/dist/* android-app/app/src/main/assets/

      - name: Ensure mipmap directory exists
        run: |
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          touch android-app/app/src/main/res/mipmap-hdpi/ic_launcher.png

      - name: Build APK with Gradle
        working-directory: android-app
        run: ./gradlew assembleRelease

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/app/build/outputs/apk/release/app-release-unsigned.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
