name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: android-ui/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          echo "Installing required SDK components..."
          yes | sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "SDK components installed successfully"

      - name: Install dependencies
        working-directory: android-ui
        run: npm ci

      - name: Build Web assets
        working-directory: android-ui
        run: npm run build

      - name: Sync to Android project
        working-directory: android-ui
        run: npx cap sync android

      - name: Debug Android project structure
        working-directory: android-ui/android
        run: |
          echo "=== Checking project structure ==="
          ls -la app/src/main/res/values/ || true
          echo "=== Checking capacitor-android module ==="
          ls -la ../node_modules/@capacitor/android/capacitor/ || true
          echo "=== Java version ==="
          java -version 2>&1
          echo "=== Gradle wrapper ==="
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        working-directory: android-ui/android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace --info 2>&1 | tail -100

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android-ui/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: android-ui/android/app/build/outputs/apk/debug/app-debug.apk
