name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: android-ui/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --install "platforms;android-35" "build-tools;35.0.1" "platform-tools" > /dev/null 2>&1
          echo "SDK components installed"

      - name: Install npm dependencies
        working-directory: android-ui
        run: npm ci

      - name: Build web assets
        working-directory: android-ui
        run: npm run build

      - name: Sync Capacitor (generates missing android files)
        working-directory: android-ui
        run: npx cap sync android

      - name: Ensure colors.xml exists (Capacitor template bug)
        working-directory: android-ui
        run: |
          COLORS_FILE="android/app/src/main/res/values/colors.xml"
          if [ ! -f "$COLORS_FILE" ]; then
            echo "Creating missing colors.xml"
            cat > "$COLORS_FILE" << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#007AFF</color>
              <color name="colorPrimaryDark">#005EC4</color>
              <color name="colorAccent">#007AFF</color>
          </resources>
          EOF
          else
            echo "colors.xml already exists"
          fi

      - name: Patch gradle.properties for CI
        working-directory: android-ui/android
        run: |
          sed -i 's/org.gradle.jvmargs=-Xmx1536m/org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8/' gradle.properties

      - name: Pre-build diagnostics
        working-directory: android-ui/android
        run: |
          echo "=== Java ==="
          java -version 2>&1
          echo "=== Key files ==="
          for f in \
            app/build.gradle \
            build.gradle \
            settings.gradle \
            variables.gradle \
            gradle.properties \
            gradle/wrapper/gradle-wrapper.properties \
            capacitor-cordova-android-plugins/build.gradle \
            app/src/main/res/values/colors.xml \
            app/src/main/res/values/styles.xml \
            app/src/main/AndroidManifest.xml \
            app/src/main/assets/public/index.html \
            app/src/main/res/xml/config.xml; do
            if [ -f "$f" ]; then
              echo "  OK: $f"
            else
              echo "  MISSING: $f"
            fi
          done

      - name: Build debug APK
        working-directory: android-ui/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Verify APK
        working-directory: android-ui/android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found!"
            find app/build -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi
          echo "APK built: $(ls -lh $APK)"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android-ui/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: android-ui/android/app/build/outputs/apk/debug/app-debug.apk
