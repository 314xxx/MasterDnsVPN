name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: android-ui/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform & build-tools
        run: |
          yes | sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install npm dependencies
        working-directory: android-ui
        run: npm ci

      - name: Build web assets
        working-directory: android-ui
        run: npm run build

      - name: Sync Capacitor Android project
        working-directory: android-ui
        run: npx cap sync android

      - name: Verify Android project structure
        working-directory: android-ui/android
        run: |
          echo "=== Java version ==="
          java -version 2>&1
          echo "=== Gradle wrapper ==="
          cat gradle/wrapper/gradle-wrapper.properties
          echo "=== Resource files ==="
          find app/src/main/res/values -type f
          echo "=== Capacitor module ==="
          ls -la ../node_modules/@capacitor/android/capacitor/build.gradle

      - name: Build debug APK
        working-directory: android-ui/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1

      - name: Verify APK exists
        working-directory: android-ui/android
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            echo "=== Build outputs ==="
            find app/build/outputs -type f 2>/dev/null || true
            exit 1
          fi
          echo "APK built successfully: $(ls -lh $APK_PATH)"

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: android-ui/android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: android-ui/android/app/build/outputs/apk/debug/app-debug.apk
